name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-about
        run: cargo install --locked --features cli cargo-about

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        working-directory: web
        run: npm install

      - name: Build Rust WASM
        working-directory: rust
        run: ./build.sh

      - name: Copy Rust WASM package
        run: |
          rm -rf web/core/pkg
          cp -r rust/photo-editor-web/pkg web/core/pkg

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Copy tone curve assets
        run: |
          mkdir -p web/dist/assets
          cp -r web/assets/tone_curve web/dist/assets/tone_curve

      - name: Prepare GitHub Pages directory
        run: |
          mkdir -p pages/RawPhotoForge/web
          cp index.html pages/RawPhotoForge/index.html
          cp -r web/dist pages/RawPhotoForge/web/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4